<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Corrix — Delivery Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============ BASE ============ */
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#05060A;
    --ink:#F2EDE8;
    --muted:#8B8FA3;
    --dim:#4A4E63;
    --gold:#D4B896;
    --gold-bright:#E8CDA8;
    --violet:#7C6FE8;
    --sage:#8FB5A8;
    --wine:#C86770;
    --line:rgba(242,237,232,0.07);
    --line-hi:rgba(242,237,232,0.15);
    --glass:rgba(10,12,20,0.55);
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --serif:'Instrument Serif',Georgia,serif;
    --sans:'Inter',system-ui,sans-serif;
    --bn:'Hind Siliguri','Inter',sans-serif;
    --ease:cubic-bezier(0.16,1,0.3,1);
    --ease-soft:cubic-bezier(0.4,0,0.2,1);
  }
  html,body{
    min-height:100vh;background:var(--bg);color:var(--ink);
    font-family:var(--sans);font-weight:400;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
    cursor:none;
  }
  @media (max-width:768px){html,body{cursor:auto}}
  .bn{font-family:var(--bn)}
  .serif{font-family:var(--serif);font-weight:400;letter-spacing:-0.02em}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  ::selection{background:rgba(212,184,150,0.35);color:#fff}
  button,input{font-family:inherit;border:none;outline:none;background:none;color:inherit}
  button{cursor:none}
  @media (max-width:768px){button{cursor:pointer}}

  /* ============ AURORA BACKGROUND ============ */
  .aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
    background:#05060A;
    transition:background 1.4s var(--ease-soft);
  }
  .aurora.risk-high{background:#0A0507}
  .aurora.risk-caution{background:#0A0805}
  .aurora.risk-safe{background:#05090A}

  .blob{
    position:absolute;border-radius:50%;
    filter:blur(100px);
    will-change:transform;
    mix-blend-mode:screen;
  }
  .blob.b1{
    width:60vw;height:60vw;max-width:780px;max-height:780px;
    background:radial-gradient(circle at 30% 30%,rgba(124,111,232,0.30) 0%,rgba(124,111,232,0.05) 50%,transparent 70%);
    top:-20%;left:-15%;
    animation:drift1 32s ease-in-out infinite;
  }
  .blob.b2{
    width:55vw;height:55vw;max-width:700px;max-height:700px;
    background:radial-gradient(circle at 50% 50%,rgba(212,184,150,0.24) 0%,rgba(212,184,150,0.04) 55%,transparent 72%);
    top:20%;right:-20%;
    animation:drift2 40s ease-in-out infinite;
  }
  .blob.b3{
    width:50vw;height:50vw;max-width:640px;max-height:640px;
    background:radial-gradient(circle at 50% 50%,rgba(200,103,112,0.20) 0%,rgba(200,103,112,0.04) 55%,transparent 72%);
    bottom:-25%;left:20%;
    animation:drift3 36s ease-in-out infinite;
  }
  @keyframes drift1{
    0%,100%{transform:translate(0,0) scale(1)}
    33%{transform:translate(15vw,10vh) scale(1.15)}
    66%{transform:translate(5vw,20vh) scale(0.9)}
  }
  @keyframes drift2{
    0%,100%{transform:translate(0,0) scale(1) rotate(0deg)}
    50%{transform:translate(-12vw,15vh) scale(1.1) rotate(180deg)}
  }
  @keyframes drift3{
    0%,100%{transform:translate(0,0) scale(1)}
    40%{transform:translate(10vw,-15vh) scale(1.2)}
    70%{transform:translate(-8vw,-8vh) scale(0.95)}
  }

  /* Grain overlay */
  .grain{
    position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0.055;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 220 220' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' seed='5'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    mix-blend-mode:overlay;
  }

  /* Mouse spotlight */
  .spotlight{
    position:fixed;inset:0;z-index:2;pointer-events:none;
    background:radial-gradient(560px circle at 50% 50%,rgba(212,184,150,0.06),transparent 40%);
    opacity:0;transition:opacity 0.5s ease;
  }
  body.spot-active .spotlight{opacity:1}

  /* Custom cursor */
  .cursor-dot,.cursor-ring{
    position:fixed;top:0;left:0;pointer-events:none;z-index:9999;
    border-radius:50%;will-change:transform;
    mix-blend-mode:difference;
  }
  .cursor-dot{
    width:6px;height:6px;background:var(--gold);
    transform:translate(-50%,-50%);
    transition:width 0.3s var(--ease),height 0.3s var(--ease),background 0.3s ease;
  }
  .cursor-ring{
    width:36px;height:36px;border:1px solid rgba(212,184,150,0.5);
    transform:translate(-50%,-50%);
    transition:width 0.4s var(--ease),height 0.4s var(--ease),border-color 0.3s ease,opacity 0.3s ease;
  }
  body.cursor-hover .cursor-dot{width:10px;height:10px;background:var(--ink)}
  body.cursor-hover .cursor-ring{width:64px;height:64px;border-color:rgba(242,237,232,0.7)}
  @media (max-width:768px){.cursor-dot,.cursor-ring{display:none}}

  /* ============ LAYOUT ============ */
  .shell{
    position:relative;z-index:5;
    max-width:560px;margin:0 auto;
    padding:26px 22px 90px;
  }

  /* ============ TOPBAR ============ */
  .top{
    display:flex;align-items:center;justify-content:space-between;
    padding-bottom:20px;margin-bottom:56px;
    border-bottom:1px solid var(--line);
    position:relative;
    opacity:0;transform:translateY(-10px);
    animation:upIn 0.9s 0.2s var(--ease) forwards;
  }
  .top::after{
    content:'';position:absolute;bottom:-1px;left:0;height:1px;
    width:0;
    background:linear-gradient(90deg,var(--gold),transparent 70%);
    animation:lineDraw 1.6s 0.5s var(--ease) forwards;
  }
  @keyframes lineDraw{to{width:80%}}
  @keyframes upIn{to{opacity:1;transform:none}}

  .brand{display:flex;align-items:center;gap:10px}
  .brand-mark{
    width:24px;height:24px;color:var(--gold);
    animation:spinSlow 24s linear infinite;
    display:grid;place-items:center;
    font-size:15px;line-height:1;
    filter:drop-shadow(0 0 8px rgba(212,184,150,0.4));
  }
  @keyframes spinSlow{to{transform:rotate(360deg)}}
  .brand-name{
    font-family:var(--serif);font-size:17px;font-weight:400;
    letter-spacing:0.16em;color:var(--ink);
  }

  .live{
    display:inline-flex;align-items:center;gap:8px;
    font-family:var(--mono);font-size:9.5px;font-weight:500;
    letter-spacing:0.22em;text-transform:uppercase;
    color:var(--sage);
    padding:5px 12px;border-radius:99px;
    background:rgba(143,181,168,0.06);
    border:1px solid rgba(143,181,168,0.18);
  }
  .live .d{
    width:5px;height:5px;border-radius:50%;background:var(--sage);
    box-shadow:0 0 10px var(--sage);
    animation:blink 2.4s ease-in-out infinite;
  }
  @keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(0.8)}}

  /* ============ HERO ============ */
  .hero{margin-bottom:44px}
  .eyebrow{
    display:flex;align-items:center;gap:12px;
    font-family:var(--mono);font-size:10px;font-weight:500;
    letter-spacing:0.28em;color:var(--dim);
    text-transform:uppercase;margin-bottom:26px;
    opacity:0;transform:translateY(8px);
    animation:upIn 0.9s 0.5s var(--ease) forwards;
  }
  .eyebrow .ln{width:26px;height:1px;background:var(--dim)}

  .headline{
    font-family:var(--serif);
    font-size:clamp(42px,10.5vw,72px);
    font-weight:400;line-height:0.98;
    letter-spacing:-0.03em;
    color:var(--ink);
    margin-bottom:20px;
  }
  .headline .line{display:block;overflow:hidden}
  .headline .line span{
    display:inline-block;
    transform:translateY(110%);
    animation:riseUp 1.1s var(--ease) forwards;
  }
  .headline .line:nth-child(1) span{animation-delay:0.6s}
  .headline .line:nth-child(2) span{animation-delay:0.75s}
  @keyframes riseUp{to{transform:none}}

  .headline em{
    font-style:italic;
    color:var(--gold);
    background:linear-gradient(120deg,var(--gold) 0%,var(--gold-bright) 50%,var(--gold) 100%);
    background-size:200% auto;
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:goldShimmer 6s linear infinite;
  }
  @keyframes goldShimmer{to{background-position:200% center}}

  .hero-sub{
    font-family:var(--bn);
    font-size:14.5px;line-height:1.75;
    color:var(--muted);max-width:420px;
    opacity:0;transform:translateY(8px);
    animation:upIn 0.9s 1s var(--ease) forwards;
  }

  /* ============ SEARCH ============ */
  .search-zone{
    margin-bottom:48px;
    opacity:0;transform:translateY(10px);
    animation:upIn 1s 1.15s var(--ease) forwards;
  }
  .search-hd{
    display:flex;align-items:center;justify-content:space-between;
    font-family:var(--mono);font-size:9.5px;font-weight:500;
    letter-spacing:0.22em;text-transform:uppercase;
    color:var(--dim);margin-bottom:14px;padding-left:2px;
  }
  .search{
    position:relative;
    display:flex;align-items:center;
    padding:6px 6px 6px 22px;
    background:var(--glass);
    backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    border:1px solid var(--line);
    border-radius:4px;
    transition:border-color 0.5s var(--ease),box-shadow 0.5s var(--ease),transform 0.5s var(--ease);
  }
  .search::before{
    content:'';position:absolute;inset:-1px;border-radius:4px;
    padding:1px;
    background:linear-gradient(135deg,transparent 40%,var(--gold) 50%,transparent 60%);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;
    opacity:0;transition:opacity 0.6s ease;
    pointer-events:none;
  }
  .search.focus{
    border-color:transparent;
    box-shadow:0 0 0 1px rgba(212,184,150,0.25),0 30px 60px -30px rgba(212,184,150,0.35);
    transform:translateY(-2px);
  }
  .search.focus::before{opacity:1}
  .search.err{
    border-color:rgba(200,103,112,0.5);
    animation:shake 0.5s cubic-bezier(.36,.07,.19,.97);
  }
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-6px)}
    40%{transform:translateX(6px)}
    60%{transform:translateX(-4px)}
    80%{transform:translateX(4px)}
  }

  .country{
    font-family:var(--mono);font-size:13px;font-weight:500;
    color:var(--dim);letter-spacing:0.04em;
    padding-right:14px;margin-right:14px;
    border-right:1px solid var(--line);
    transition:color 0.4s ease;
  }
  .search.focus .country{color:var(--gold)}

  .search input{
    flex:1;
    font-family:var(--mono);
    font-size:16px;font-weight:500;
    letter-spacing:0.06em;
    padding:16px 0;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
    min-width:0;
    caret-color:var(--gold);
  }
  .search input::placeholder{
    color:var(--dim);font-weight:400;
    letter-spacing:0.04em;
  }
  .search input:disabled{-webkit-text-fill-color:transparent}

  .submit{
    position:relative;
    display:inline-flex;align-items:center;gap:10px;
    padding:14px 22px;
    border-radius:2px;
    background:var(--ink);
    color:var(--bg);
    font-family:var(--mono);font-size:11px;font-weight:600;
    letter-spacing:0.2em;text-transform:uppercase;
    overflow:hidden;
    will-change:transform;
    transition:transform 0.4s var(--ease),box-shadow 0.4s var(--ease),background 0.4s ease;
    box-shadow:0 4px 20px -8px rgba(242,237,232,0.3);
  }
  .submit:hover:not(:disabled){
    box-shadow:0 8px 30px -8px rgba(242,237,232,0.5);
  }
  .submit:active:not(:disabled){transform:scale(0.97)}
  .submit svg{transition:transform 0.4s var(--ease)}
  .submit:hover:not(:disabled) svg{transform:translateX(3px)}
  .submit:disabled{opacity:0.6;cursor:not-allowed}
  .submit .ripple{
    position:absolute;border-radius:50%;
    background:rgba(212,184,150,0.5);
    transform:translate(-50%,-50%) scale(0);
    pointer-events:none;
    animation:rippleOut 0.7s var(--ease) forwards;
  }
  @keyframes rippleOut{to{transform:translate(-50%,-50%) scale(6);opacity:0}}
  .submit.busy{background:transparent;color:var(--gold);box-shadow:inset 0 0 0 1px rgba(212,184,150,0.35)}
  .submit.busy .txt,.submit.busy svg{display:none}
  .submit .sp{
    display:none;
    width:14px;height:14px;border-radius:50%;
    border:1.5px solid rgba(212,184,150,0.25);
    border-top-color:var(--gold);
    animation:spin 0.8s linear infinite;
  }
  .submit.busy .sp{display:block}
  @keyframes spin{to{transform:rotate(360deg)}}

  .hint{
    font-family:var(--bn);
    font-size:12.5px;font-weight:500;
    color:var(--wine);letter-spacing:0.01em;
    margin-top:12px;padding-left:4px;
    min-height:16px;
    opacity:0;transform:translateY(-4px);
    transition:all 0.4s var(--ease);
  }
  .hint.on{opacity:1;transform:none}

  /* ============ STAGE ============ */
  .stage{position:relative;min-height:180px}

  /* ---- IDLE ---- */
  .idle{
    display:flex;flex-direction:column;align-items:center;
    padding:64px 24px;
    opacity:0;transform:translateY(10px);
    animation:upIn 1s 1.4s var(--ease) forwards;
  }
  .idle.hide{display:none}
  .idle-visual{
    position:relative;width:96px;height:96px;
    display:grid;place-items:center;margin-bottom:28px;
  }
  .idle-visual::before,
  .idle-visual::after{
    content:'';position:absolute;inset:0;border-radius:50%;
    border:1px solid rgba(212,184,150,0.18);
  }
  .idle-visual::before{animation:spinSlow 30s linear infinite}
  .idle-visual::after{
    inset:16px;
    border-style:dashed;
    border-color:rgba(212,184,150,0.12);
    animation:spinSlow 20s linear infinite reverse;
  }
  .idle-core{
    width:6px;height:6px;border-radius:50%;
    background:var(--gold);
    box-shadow:0 0 24px var(--gold),0 0 40px rgba(212,184,150,0.4);
    animation:corePulse 2.6s ease-in-out infinite;
  }
  @keyframes corePulse{
    0%,100%{transform:scale(1);opacity:1}
    50%{transform:scale(0.55);opacity:0.5}
  }
  .idle-title{
    font-family:var(--serif);
    font-size:19px;font-weight:400;
    color:var(--ink);margin-bottom:8px;
    letter-spacing:-0.01em;
  }
  .idle-sub{
    font-family:var(--bn);
    font-size:12.5px;color:var(--dim);
    letter-spacing:0.02em;text-align:center;
  }

  /* ============ REPORT ============ */
  .report{display:none;flex-direction:column;gap:0}
  .report.on{display:flex}

  /* Card */
  .card{
    position:relative;
    background:
      radial-gradient(120% 80% at 50% 0%,rgba(212,184,150,0.06) 0%,transparent 55%),
      linear-gradient(180deg,rgba(14,16,26,0.92),rgba(8,9,16,0.95));
    border:1px solid var(--line);
    border-radius:6px;
    overflow:hidden;
    backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    box-shadow:
      0 50px 100px -40px rgba(0,0,0,0.9),
      0 0 0 1px rgba(242,237,232,0.02) inset,
      0 1px 0 0 rgba(242,237,232,0.04) inset;
    transform-style:preserve-3d;
    will-change:transform;
    transition:transform 0.5s var(--ease-soft);
    opacity:0;transform:translateY(30px) scale(0.96);filter:blur(6px);
  }
  .card.on{opacity:1;transform:none;filter:blur(0);transition:opacity 1s var(--ease),transform 1s var(--ease),filter 1s var(--ease)}
  .card::before{
    content:'';position:absolute;inset:0;border-radius:6px;
    background:conic-gradient(from 180deg at 50% 50%,transparent 0deg,rgba(212,184,150,0.08) 90deg,transparent 180deg,rgba(124,111,232,0.06) 270deg,transparent 360deg);
    opacity:0;transition:opacity 0.6s ease;
    pointer-events:none;mix-blend-mode:overlay;
  }
  .card:hover::before{opacity:1}

  .scanline{
    position:absolute;left:0;right:0;height:40%;top:-40%;
    background:linear-gradient(180deg,transparent 0%,rgba(212,184,150,0.10) 50%,transparent 100%);
    pointer-events:none;z-index:10;opacity:0;
  }
  .card.on .scanline{animation:scanSweep 2s 0.6s var(--ease) forwards}
  @keyframes scanSweep{
    0%{top:-40%;opacity:0}
    20%{opacity:1}
    80%{opacity:1}
    100%{top:140%;opacity:0}
  }

  /* Header */
  .card-head{padding:34px 30px 0}
  .scan-id{
    display:flex;align-items:center;justify-content:space-between;
    font-family:var(--mono);font-size:9.5px;font-weight:500;
    letter-spacing:0.22em;text-transform:uppercase;
    color:var(--dim);padding-bottom:16px;
    border-bottom:1px solid var(--line);
    opacity:0;
  }
  .card.on .scan-id{animation:upIn 0.7s 0.3s var(--ease) forwards}
  .scan-id .l{display:flex;align-items:center;gap:8px}
  .scan-id .l::before{
    content:'';width:5px;height:5px;border-radius:50%;
    background:var(--sage);box-shadow:0 0 8px var(--sage);
    animation:blink 1.8s ease-in-out infinite;
  }

  /* Identity */
  .identity{
    padding:28px 0 26px;
    border-bottom:1px solid var(--line);
    position:relative;
  }
  .id-label{
    display:flex;align-items:center;justify-content:space-between;
    font-family:var(--mono);font-size:9.5px;font-weight:500;
    letter-spacing:0.26em;text-transform:uppercase;
    color:var(--dim);margin-bottom:14px;
    opacity:0;
  }
  .card.on .id-label{animation:upIn 0.6s 0.5s var(--ease) forwards}

  .phone{
    font-family:var(--mono);
    font-size:clamp(28px,7.5vw,38px);
    font-weight:500;
    letter-spacing:-0.01em;
    color:var(--ink);
    line-height:1.1;
    display:inline-block;
    overflow:hidden;
  }
  .phone .ch{
    display:inline-block;
    transform:translateY(120%);
    opacity:0;
  }
  .card.on .phone .ch{
    animation:chUp 0.7s var(--ease) forwards;
  }
  @keyframes chUp{to{transform:none;opacity:1}}

  /* Risk stamp */
  .stamp-wrap{
    position:absolute;right:0;top:32px;
    opacity:0;
  }
  .card.on .stamp-wrap{animation:stampIn 0.9s 1.1s var(--ease) forwards}
  @keyframes stampIn{
    0%{opacity:0;transform:scale(1.6) rotate(-10deg);filter:blur(10px)}
    60%{opacity:1;filter:blur(0)}
    75%{transform:scale(0.94) rotate(-6deg)}
    100%{opacity:1;transform:scale(1) rotate(-6deg)}
  }
  .stamp{
    display:inline-block;
    font-family:var(--mono);font-size:11px;font-weight:600;
    letter-spacing:0.3em;text-transform:uppercase;
    padding:9px 16px;
    border:1.5px solid currentColor;
    position:relative;
    white-space:nowrap;
  }
  .stamp::before{
    content:'';position:absolute;inset:-4px;
    border:1px solid currentColor;opacity:0.28;
  }
  .stamp.high{color:var(--wine)}
  .stamp.caution{color:var(--gold)}
  .stamp.safe{color:var(--sage)}

  /* Meta row */
  .meta{
    display:flex;align-items:center;gap:12px;
    margin-top:16px;
    font-family:var(--mono);font-size:9.5px;
    letter-spacing:0.18em;color:var(--dim);
    text-transform:uppercase;
    opacity:0;
  }
  .card.on .meta{animation:upIn 0.6s 0.9s var(--ease) forwards}
  .meta .sep{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

  /* Score */
  .score{
    display:grid;grid-template-columns:1fr auto;
    gap:26px;align-items:center;
    padding:36px 30px 30px;
    border-bottom:1px solid var(--line);
    opacity:0;
  }
  .card.on .score{animation:upIn 0.8s 0.7s var(--ease) forwards}

  .score-label{
    font-family:var(--mono);font-size:9.5px;font-weight:500;
    letter-spacing:0.26em;text-transform:uppercase;
    color:var(--dim);margin-bottom:14px;
  }
  .score-num{
    font-family:var(--mono);
    font-size:clamp(56px,15vw,80px);
    font-weight:600;
    line-height:0.88;
    letter-spacing:-0.05em;
    color:var(--ink);
    display:flex;align-items:baseline;
    font-variant-numeric:tabular-nums;
  }
  .score-num .sf{
    font-size:0.4em;color:var(--muted);
    margin-left:4px;font-weight:500;
    letter-spacing:0;
  }
  .score-desc{
    font-family:var(--mono);font-size:11px;
    color:var(--muted);letter-spacing:0.04em;
    margin-top:16px;
  }
  .score-desc b{color:var(--ink);font-weight:600}

  /* Radial gauge */
  .gauge{
    position:relative;width:150px;height:150px;
    flex-shrink:0;
  }
  .gauge svg{
    width:100%;height:100%;
    transform:rotate(-90deg);
    overflow:visible;
  }
  .g-track{fill:none;stroke:rgba(242,237,232,0.05);stroke-width:5}
  .g-ticks{fill:none;stroke:rgba(242,237,232,0.12);stroke-width:1}
  .g-prog{
    fill:none;stroke-width:5;stroke-linecap:round;
    stroke-dasharray:314.16;
    stroke-dashoffset:314.16;
    transition:stroke-dashoffset 2.2s var(--ease);
    filter:drop-shadow(0 0 8px currentColor);
  }
  .g-pen{
    fill:currentColor;
    filter:drop-shadow(0 0 12px currentColor);
    transition:transform 2.2s var(--ease);
    transform-box:fill-box;
    transform-origin:center;
  }
  .g-tick-ring{
    transform-origin:60px 60px;
    animation:tickSpin 40s linear infinite;
  }
  @keyframes tickSpin{to{transform:rotate(360deg)}}
  .g-center{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    text-align:center;
  }
  .g-num{
    font-family:var(--mono);font-size:24px;
    font-weight:600;letter-spacing:-0.03em;
    color:var(--ink);line-height:1;
    font-variant-numeric:tabular-nums;
  }
  .g-txt{
    font-family:var(--mono);font-size:8.5px;
    letter-spacing:0.24em;text-transform:uppercase;
    color:var(--dim);margin-top:6px;
  }

  /* Bengali message */
  .msg{
    padding:26px 30px;
    border-bottom:1px solid var(--line);
    font-family:var(--bn);
    font-size:15px;line-height:1.8;
    color:#D5CFC8;
    position:relative;
    opacity:0;
  }
  .card.on .msg{animation:upIn 0.8s 1.6s var(--ease) forwards}
  .msg::before{
    content:'';position:absolute;
    left:14px;top:30px;bottom:30px;width:1.5px;
    background:linear-gradient(180deg,var(--gold),transparent);
    transform:scaleY(0);transform-origin:top;
  }
  .card.on .msg::before{animation:barGrow 0.9s 2s var(--ease) forwards}
  @keyframes barGrow{to{transform:scaleY(1)}}
  .msg .mword{
    display:inline-block;
    opacity:0;filter:blur(6px);
  }
  .card.on .msg .mword{
    animation:wordIn 0.6s var(--ease) forwards;
  }
  @keyframes wordIn{to{opacity:1;filter:blur(0)}}

  /* Stats */
  .stats{
    display:grid;grid-template-columns:repeat(3,1fr);
    padding:30px 30px 26px;
    border-bottom:1px solid var(--line);
  }
  .stat{
    padding-right:12px;position:relative;
    opacity:0;transform:translateY(10px);
  }
  .card.on .stat{animation:upIn 0.7s var(--ease) forwards}
  .card.on .stat:nth-child(1){animation-delay:2.2s}
  .card.on .stat:nth-child(2){animation-delay:2.3s}
  .card.on .stat:nth-child(3){animation-delay:2.4s}
  .stat+.stat{padding-left:20px}
  .stat+.stat::before{
    content:'';position:absolute;left:0;top:10%;bottom:10%;
    width:1px;background:var(--line);
    transform:scaleY(0);transform-origin:top;
  }
  .card.on .stat+.stat::before{
    animation:barGrow 0.6s 2.5s var(--ease) forwards;
  }
  .stat-n{
    font-family:var(--mono);
    font-size:32px;font-weight:600;
    letter-spacing:-0.03em;line-height:1;
    margin-bottom:10px;
    font-variant-numeric:tabular-nums;
    color:var(--ink);
  }
  .stat-l{
    font-family:var(--mono);font-size:9px;
    letter-spacing:0.24em;text-transform:uppercase;
    color:var(--dim);
  }
  .stat-bar{
    margin-top:14px;height:1px;
    background:rgba(242,237,232,0.05);
    position:relative;overflow:hidden;
  }
  .stat-bar::after{
    content:'';position:absolute;left:0;top:0;bottom:0;
    width:0;background:currentColor;
    box-shadow:0 0 8px currentColor;
  }
  .card.on .stat-bar::after{
    animation:barFill 1.4s var(--ease) forwards;
  }
  .card.on .stat:nth-child(1) .stat-bar::after{animation-delay:2.3s}
  .card.on .stat:nth-child(2) .stat-bar::after{animation-delay:2.4s}
  .card.on .stat:nth-child(3) .stat-bar::after{animation-delay:2.5s}
  @keyframes barFill{to{width:100%}}

  /* Couriers */
  .couriers{padding:0 30px 30px}
  .ch-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:26px 0 18px;
    border-bottom:1px solid var(--line);
    opacity:0;
  }
  .card.on .ch-head{animation:upIn 0.6s 2.7s var(--ease) forwards}
  .ch-head h3{
    font-family:var(--serif);
    font-size:17px;font-weight:400;
    letter-spacing:-0.01em;color:var(--ink);
    display:flex;align-items:center;gap:10px;
  }
  .ch-head h3::before{
    content:'';width:2px;height:14px;
    background:var(--gold);border-radius:1px;
  }
  .ch-head .cnt{
    font-family:var(--mono);font-size:9.5px;
    letter-spacing:0.22em;text-transform:uppercase;
    color:var(--dim);
  }

  .courier{
    display:grid;
    grid-template-columns:1.4fr 0.7fr 1.1fr auto;
    gap:14px;align-items:center;
    padding:20px 0;
    border-bottom:1px solid var(--line);
    opacity:0;transform:translateY(14px);
  }
  .courier:last-child{border-bottom:none;padding-bottom:0}
  .card.on .courier{
    animation:upIn 0.7s var(--ease) forwards;
  }
  .c-name{
    display:flex;align-items:center;gap:10px;
    font-family:var(--sans);
    font-size:14px;font-weight:500;
    color:var(--ink);min-width:0;
  }
  .c-dot{
    width:6px;height:6px;border-radius:50%;
    flex-shrink:0;position:relative;
  }
  .c-dot::after{
    content:'';position:absolute;inset:-5px;
    border-radius:50%;border:1px solid currentColor;
    opacity:0;
  }
  .card.on .c-dot::after{animation:dotPulse 2.8s ease-in-out infinite}
  @keyframes dotPulse{
    0%{transform:scale(0.8);opacity:0.6}
    100%{transform:scale(1.6);opacity:0}
  }
  .c-orders{
    font-family:var(--mono);
    font-size:13.5px;font-weight:500;
    color:var(--muted);text-align:center;
    font-variant-numeric:tabular-nums;
  }
  .c-orders .lbl{
    display:block;font-size:8.5px;
    letter-spacing:0.22em;color:var(--dim);
    margin-top:4px;font-weight:400;
  }
  .c-bar{
    height:2px;background:rgba(242,237,232,0.06);
    border-radius:2px;overflow:hidden;
    position:relative;
  }
  .c-bar-f{
    height:100%;width:0%;border-radius:2px;
    transition:width 1.8s var(--ease);
    box-shadow:0 0 8px currentColor;
  }
  .c-rate{
    font-family:var(--mono);
    font-size:14px;font-weight:600;
    text-align:right;min-width:52px;
    font-variant-numeric:tabular-nums;
  }

  /* Footer note */
  .foot{
    margin-top:36px;padding-top:20px;
    border-top:1px solid var(--line);
    font-family:var(--mono);font-size:9.5px;
    letter-spacing:0.22em;text-transform:uppercase;
    color:var(--dim);
    display:flex;align-items:center;justify-content:space-between;
    opacity:0;transition:opacity 0.8s ease;
  }
  .foot.on{opacity:1}
  .foot .sep{flex:1;height:1px;margin:0 14px;background:linear-gradient(90deg,transparent,var(--line),transparent)}

  /* Empty state */
  .empty{
    padding:70px 30px;
    text-align:center;
    border-top:1px solid var(--line);
    border-bottom:1px solid var(--line);
    opacity:0;transform:translateY(20px) scale(0.98);
    transition:all 0.9s var(--ease);
  }
  .empty.on{opacity:1;transform:none}
  .empty-ico{
    width:40px;height:40px;margin:0 auto 22px;
    color:var(--gold);opacity:0.6;
  }
  .empty-ttl{
    font-family:var(--serif);
    font-size:24px;font-weight:400;
    letter-spacing:-0.01em;
    color:var(--ink);margin-bottom:12px;
  }
  .empty-dsc{
    font-family:var(--bn);
    font-size:13.5px;color:var(--muted);
    line-height:1.8;max-width:340px;margin:0 auto;
  }

  /* ============ RESPONSIVE ============ */
  @media (max-width:480px){
    .shell{padding:22px 18px 70px}
    .top{margin-bottom:44px}
    .hero{margin-bottom:36px}
    .search{padding:5px 5px 5px 18px}
    .country{padding-right:10px;margin-right:10px;font-size:12px}
    .search input{padding:14px 0;font-size:15px}
    .submit{padding:12px 16px;font-size:10px}
    .submit .lbl{display:none}
    .card-head{padding:26px 22px 0}
    .score{padding:30px 22px 26px;gap:18px}
    .score-num{font-size:52px}
    .gauge{width:118px;height:118px}
    .msg{padding:22px 22px}
    .stats{padding:26px 22px 22px}
    .stat-n{font-size:26px}
    .couriers{padding:0 22px 26px}
    .courier{grid-template-columns:1.3fr 0.6fr 1fr auto;gap:10px;padding:16px 0}
    .c-name{font-size:13px}
    .c-rate{font-size:13px;min-width:44px}
    .stamp-wrap{top:26px}
    .stamp{font-size:9px;padding:7px 12px;letter-spacing:0.24em}
  }
</style>
</head>
<body>

<!-- Background layers -->
<div class="aurora" id="aurora">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>
<div class="grain"></div>
<div class="spotlight" id="spotlight"></div>

<!-- Custom cursor -->
<div class="cursor-ring" id="cRing"></div>
<div class="cursor-dot" id="cDot"></div>

<div class="shell">

  <!-- TOPBAR -->
  <div class="top">
    <div class="brand">
      <span class="brand-mark">◆</span>
      <span class="brand-name">CORRIX</span>
    </div>
    <div class="live"><span class="d"></span>Secure · Live</div>
  </div>

  <!-- HERO -->
  <section class="hero">
    <div class="eyebrow">
      <span class="ln"></span>
      <span>Fraud Intelligence Unit</span>
    </div>
    <h1 class="headline">
      <span class="line"><span>Verify before</span></span>
      <span class="line"><span><em>you ship.</em></span></span>
    </h1>
    <p class="hero-sub">যেকোনো কাস্টমারের ডেলিভারি হিস্ট্রি, রিটার্ন রেট এবং ঝুঁকির মাত্রা সেকেন্ডেই জানুন — সব কুরিয়ার নেটওয়ার্ক একসাথে।</p>
  </section>

  <!-- SEARCH -->
  <section class="search-zone">
    <div class="search-hd">
      <span>Target Lookup</span>
      <span class="mono" style="color:var(--dim)">E.164 · BD</span>
    </div>
    <form class="search" id="form">
      <span class="country">+88</span>
      <input id="phone" type="tel" placeholder="01XXXXXXXXX"
             autocomplete="off" inputmode="numeric" maxlength="11"
             oninput="this.value=this.value.replace(/[^0-9]/g,'')">
      <button type="submit" class="submit" id="btn">
        <span class="lbl txt">Scan</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"/>
          <polyline points="12 5 19 12 12 19"/>
        </svg>
        <span class="sp"></span>
      </button>
    </form>
    <div class="hint" id="hint"></div>
  </section>

  <!-- STAGE -->
  <section class="stage" id="stage">
    <div class="idle" id="idle">
      <div class="idle-visual">
        <div class="idle-core"></div>
      </div>
      <div class="idle-title">Awaiting target</div>
      <div class="idle-sub">ডেলিভারি হিস্ট্রি দেখতে নম্বর দিন</div>
    </div>
  </section>

</div>

<script>
(() => {
  'use strict';

  const API = '/api/check?phone=';
  const $ = (s,c=document)=>c.querySelector(s);
  const $$ = (s,c=document)=>Array.from(c.querySelectorAll(s));
  const sleep = ms => new Promise(r => setTimeout(r, ms));

  const input = $('#phone');
  const form = $('#form');
  const btn = $('#btn');
  const hint = $('#hint');
  const idle = $('#idle');
  const stage = $('#stage');
  const aurora = $('#aurora');

  let busy = false;

  // ============ CUSTOM CURSOR ============
  (() => {
    const dot = $('#cDot'), ring = $('#cRing');
    if (!dot || !ring) return;
    let mx = window.innerWidth/2, my = window.innerHeight/2;
    let rx = mx, ry = my;
    window.addEventListener('mousemove', e => {
      mx = e.clientX; my = e.clientY;
      dot.style.transform = `translate(${mx}px,${my}px) translate(-50%,-50%)`;
      document.body.classList.add('spot-active');
    });
    (function loop(){
      rx += (mx - rx) * 0.16;
      ry += (my - ry) * 0.16;
      ring.style.transform = `translate(${rx}px,${ry}px) translate(-50%,-50%)`;
      requestAnimationFrame(loop);
    })();

    // Hover state
    const hoverables = 'a,button,input,[data-hover]';
    document.addEventListener('mouseover', e => {
      if (e.target.closest(hoverables)) document.body.classList.add('cursor-hover');
    });
    document.addEventListener('mouseout', e => {
      if (e.target.closest(hoverables)) document.body.classList.remove('cursor-hover');
    });
  })();

  // ============ SPOTLIGHT ============
  (() => {
    const spot = $('#spotlight');
    if (!spot) return;
    document.addEventListener('mousemove', e => {
      spot.style.background = `radial-gradient(560px circle at ${e.clientX}px ${e.clientY}px, rgba(212,184,150,0.06), transparent 40%)`;
    });
  })();

  // ============ CARD TILT ============
  function attachTilt(card){
    if (!card || window.innerWidth < 768) return;
    const strength = 6;
    card.style.transformStyle = 'preserve-3d';
    card.addEventListener('mousemove', e => {
      const r = card.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width - 0.5;
      const y = (e.clientY - r.top) / r.height - 0.5;
      const ry = x * strength;
      const rx = -y * strength;
      card.style.transform = `perspective(1000px) rotateX(${rx}deg) rotateY(${ry}deg)`;
    });
    card.addEventListener('mouseleave', () => {
      card.style.transform = '';
    });
  }

  // ============ FOCUS EFFECTS ============
  input.addEventListener('focus', () => form.classList.add('focus'));
  input.addEventListener('blur', () => form.classList.remove('focus'));
  input.addEventListener('input', () => {
    if (form.classList.contains('err')) {
      form.classList.remove('err');
      hint.classList.remove('on');
    }
  });

  function showErr(msg){
    form.classList.remove('err');
    void form.offsetWidth;
    form.classList.add('err');
    hint.textContent = msg;
    hint.classList.add('on');
  }

  // ============ RIPPLE ON SUBMIT ============
  btn.addEventListener('click', e => {
    const r = btn.getBoundingClientRect();
    const ripple = document.createElement('span');
    ripple.className = 'ripple';
    ripple.style.left = (e.clientX - r.left) + 'px';
    ripple.style.top = (e.clientY - r.top) + 'px';
    ripple.style.width = ripple.style.height = '20px';
    btn.appendChild(ripple);
    setTimeout(() => ripple.remove(), 700);
  });

  // ============ RISK STYLE ============
  function riskOf(level, rate){
    const l = (level||'').toLowerCase();
    if (l === 'high' || rate < 50) return { cls:'high', color:'#C86770', key:'risk-high' };
    if (l === 'moderate' || l === 'medium' || rate < 80) return { cls:'caution', color:'#D4B896', key:'risk-caution' };
    return { cls:'safe', color:'#8FB5A8', key:'risk-safe' };
  }
  function rateColor(r){
    if (r >= 75) return '#8FB5A8';
    if (r >= 50) return '#D4B896';
    return '#C86770';
  }

  // ============ COUNT UP ============
  function countUp(el, target, dur=1500, suffix=''){
    const t = Number(target) || 0;
    const start = performance.now();
    function tick(now){
      const p = Math.min((now - start) / dur, 1);
      const eased = 1 - Math.pow(1 - p, 4);
      el.textContent = Math.round(eased * t) + suffix;
      if (p < 1) requestAnimationFrame(tick);
      else el.textContent = t + suffix;
    }
    requestAnimationFrame(tick);
  }

  // ============ SCRAMBLE REVEAL ============
  function scrambleNumber(el, target, dur=1500, suffix=''){
    const final = String(target) + suffix;
    const numChars = '0123456789';
    const start = performance.now();
    function tick(now){
      const p = Math.min((now - start) / dur, 1);
      const reveal = Math.floor(p * final.length);
      let out = '';
      for (let i = 0; i < final.length; i++){
        const c = final[i];
        if (i < reveal) out += c;
        else if (/\d/.test(c)) out += numChars[Math.floor(Math.random()*10)];
        else out += c;
      }
      el.textContent = out;
      if (p < 1) requestAnimationFrame(tick);
      else el.textContent = final;
    }
    requestAnimationFrame(tick);
  }

  // ============ PHONE CHARS ============
  function phoneCharsHTML(phone){
    let f = phone;
    if (phone.length === 11) f = phone.slice(0,5) + ' ' + phone.slice(5);
    return [...f].map((c,i) => {
      const delay = 0.5 + i * 0.045;
      return `<span class="ch" style="animation-delay:${delay}s">${c}</span>`;
    }).join('');
  }

  // ============ WORD SPLIT ============
  function splitWordsHTML(text){
    const parts = text.split(/(\s+)/);
    let idx = 0;
    return parts.map(p => {
      if (/\s+/.test(p)) return p;
      const d = 1.8 + idx * 0.035;
      idx++;
      return `<span class="mword" style="animation-delay:${d}s">${p}</span>`;
    }).join('');
  }

  // ============ API ============
  async function fetchReport(phone){
    try {
      const res = await fetch(API + encodeURIComponent(phone), { method:'GET' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const j = await res.json();
      if (j && j.success && j.data) return { ok:true, data:j.data };
      return { ok:false, error:'এই নম্বরে কোনো ডেলিভারি রেকর্ড নেই।' };
    } catch(e){
      console.error(e);
      return { ok:false, error:'সার্ভারে সংযোগ ব্যর্থ। ইন্টারনেট বা CORS সমস্যা।' };
    }
  }

  // ============ EMPTY ============
  function renderEmpty(title, desc){
    aurora.className = 'aurora';
    stage.innerHTML = `
      <div class="empty" id="emp">
        <svg class="empty-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <circle cx="12" cy="16" r="0.5" fill="currentColor"/>
        </svg>
        <div class="empty-ttl">${title}</div>
        <p class="empty-dsc">${desc}</p>
      </div>`;
    requestAnimationFrame(() => $('#emp')?.classList.add('on'));
  }

  // ============ REPORT ============
  function renderReport(d){
    if (!d.totalOrders || Number(d.totalOrders) === 0){
      renderEmpty('No Records Found', 'এই নম্বরে কোনো ডেলিভারি রেকর্ড নেই।');
      return;
    }

    const rate = Number(d.deliveryRate) || 0;
    const rs = riskOf(d.riskLevel, rate);
    const CIRC = 314.16;
    const offset = CIRC - (CIRC * Math.min(Math.max(rate,0),100) / 100);
    const rotation = (Math.min(Math.max(rate,0),100) / 100) * 360;

    // Background tint
    aurora.className = 'aurora ' + rs.key;

    const dt = d.searchDate ? new Date(d.searchDate) : new Date();
    const timeStr = dt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
    const dateStr = dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}).toUpperCase();
    const scanId = '#' + String(Math.floor(Math.random()*9000+1000));

    const active = (d.couriers || []).filter(c => Number(c.orders) > 0);

    stage.innerHTML = `
      <article class="card" id="rep">
        <div class="scanline"></div>

        <div class="card-head">
          <div class="scan-id">
            <div class="l">SCAN ${scanId}</div>
            <div>${dateStr} · ${timeStr}</div>
          </div>

          <div class="identity">
            <div class="id-label">
              <span>Target Entity</span>
              <span>${(d.phoneNumber||'').length} DIGITS</span>
            </div>
            <div class="phone" id="odo">${phoneCharsHTML(d.phoneNumber || '')}</div>
            <div class="stamp-wrap">
              <div class="stamp ${rs.cls}">${rs.cls === 'high' ? 'High Risk' : rs.cls === 'caution' ? 'Caution' : 'Safe'}</div>
            </div>
            <div class="meta">
              <span>CROSS-NETWORK</span>
              <span class="sep"></span>
              <span>${(d.couriers||[]).length} PARTNERS</span>
            </div>
          </div>
        </div>

        <div class="score">
          <div>
            <div class="score-label">Success Rate</div>
            <div class="score-num">
              <span id="scVal">0</span><span class="sf">%</span>
            </div>
            <div class="score-desc">
              <b id="scD">0</b> delivered · <b id="scC">0</b> returned
            </div>
          </div>
          <div class="gauge">
            <svg viewBox="0 0 120 120">
              <g class="g-tick-ring">
                ${Array.from({length:36}).map((_,i)=>{
                  const a = (i/36)*Math.PI*2;
                  const x1 = 60 + Math.cos(a)*56;
                  const y1 = 60 + Math.sin(a)*56;
                  const x2 = 60 + Math.cos(a)*58;
                  const y2 = 60 + Math.sin(a)*58;
                  return `<line class="g-ticks" x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}"/>`;
                }).join('')}
              </g>
              <circle class="g-track" cx="60" cy="60" r="50"/>
              <circle class="g-prog" id="gProg" cx="60" cy="60" r="50"
                      stroke="${rs.color}"
                      stroke-dasharray="${CIRC}"
                      stroke-dashoffset="${CIRC}"/>
              <circle class="g-pen" id="gPen" cx="60" cy="10" r="2.5"
                      style="color:${rs.color};transform-origin:60px 60px;transform:rotate(0deg)"/>
            </svg>
            <div class="g-center">
              <div class="g-num mono" id="gVal">0%</div>
              <div class="g-txt">Delivery</div>
            </div>
          </div>
        </div>

        ${d.riskMessage ? `<div class="msg" id="bnMsg">${splitWordsHTML(d.riskMessage)}</div>` : ''}

        <div class="stats">
          <div class="stat" style="color:#5B8DEF">
            <div class="stat-n" id="sOrders">0</div>
            <div class="stat-l">Orders</div>
            <div class="stat-bar"></div>
          </div>
          <div class="stat" style="color:#8FB5A8">
            <div class="stat-n" id="sDeliv">0</div>
            <div class="stat-l">Success</div>
            <div class="stat-bar"></div>
          </div>
          <div class="stat" style="color:#C86770">
            <div class="stat-n" id="sCancel">0</div>
            <div class="stat-l">Returns</div>
            <div class="stat-bar"></div>
          </div>
        </div>

        <div class="couriers">
          <div class="ch-head">
            <h3>Network Breakdown</h3>
            <span class="cnt">${active.length} Active</span>
          </div>
          <div class="c-list">
            ${active.length ? active.map((c, i) => {
              const raw = parseFloat(String(c.delivery_rate).replace(/[^0-9.]/g,'')) || 0;
              const col = rateColor(raw);
              const shown = Number.isInteger(raw) ? raw : raw.toFixed(1);
              const w = Math.min(raw, 100);
              const delay = 2.9 + i * 0.12;
              return `
                <div class="courier" data-i="${i}" style="animation-delay:${delay}s">
                  <div class="c-name">
                    <span class="c-dot" style="background:${col};color:${col}"></span>
                    <span>${c.name}</span>
                  </div>
                  <div class="c-orders mono">
                    ${c.orders||0}
                    <span class="lbl">ORD</span>
                  </div>
                  <div class="c-bar" style="color:${col}">
                    <div class="c-bar-f" data-w="${w}"></div>
                  </div>
                  <div class="c-rate" style="color:${col}" data-t="${shown}">0%</div>
                </div>`;
            }).join('') : `<div style="padding:20px 0;color:var(--muted);font-size:13px">No courier history</div>`}
          </div>
        </div>
      </article>
    `;

    const rep = $('#rep');
    attachTilt(rep);

    // Kickoff
    setTimeout(() => {
      rep.classList.add('on');
    }, 30);

    // Gauge draw after card entrance
    setTimeout(() => {
      const prog = $('#gProg');
      const pen = $('#gPen');
      if (prog) prog.style.strokeDashoffset = offset.toFixed(2);
      if (pen) pen.style.transform = `rotate(${rotation}deg)`;
    }, 1400);

    // Score number scramble
    setTimeout(() => scrambleNumber($('#scVal'), Math.round(rate), 1600), 1400);
    setTimeout(() => {
      countUp($('#scD'), d.totalDelivered, 1200);
      countUp($('#scC'), d.totalCancelled, 1200);
    }, 1600);

    // Gauge center
    setTimeout(() => scrambleNumber($('#gVal'), Math.round(rate), 1600, '%'), 1400);

    // Stats
    setTimeout(() => {
      scrambleNumber($('#sOrders'), d.totalOrders, 1200);
      scrambleNumber($('#sDeliv'), d.totalDelivered, 1200);
      scrambleNumber($('#sCancel'), d.totalCancelled, 1200);
    }, 2200);

    // Courier bars + rates
    setTimeout(() => {
      $$('.courier').forEach((row, i) => {
        const bar = row.querySelector('.c-bar-f');
        if (bar){
          setTimeout(() => {
            bar.style.width = bar.dataset.w + '%';
            bar.style.background = row.querySelector('.c-rate').style.color;
          }, 300 + i * 130);
        }
        const rateEl = row.querySelector('.c-rate[data-t]');
        if (rateEl){
          const t = parseFloat(rateEl.dataset.t) || 0;
          setTimeout(() => {
            scrambleNumber(rateEl, Number.isInteger(t) ? t : t, 1200, '%');
          }, 400 + i * 130);
        }
      });
    }, 2900);

    // Footer
    setTimeout(() => {
      const foot = document.createElement('div');
      foot.className = 'foot';
      foot.innerHTML = `
        <span>${(d.couriers||[]).length} NETWORKS</span>
        <span class="sep"></span>
        <span>END OF REPORT</span>
      `;
      stage.appendChild(foot);
      requestAnimationFrame(() => foot.classList.add('on'));
    }, 3400);
  }

  // ============ FLOW ============
  async function run(){
    if (busy) return;
    const phone = input.value.trim().replace(/\D/g,'');

    if (phone.length === 0){ showErr('মোবাইল নম্বর দিন।'); return; }
    if (phone.length < 11){ showErr('অসম্পূর্ণ নম্বর। ১১ ডিজিট লিখুন।'); return; }
    if (phone.length > 11){ showErr('১১ ডিজিটের বেশি লেখা যাবে না।'); return; }
    if (!phone.startsWith('01')){ showErr('নম্বর অবশ্যই 01 দিয়ে শুরু হতে হবে।'); return; }

    busy = true;
    hint.classList.remove('on');
    input.disabled = true;
    btn.disabled = true;
    btn.classList.add('busy');

    idle.classList.add('hide');
    stage.querySelectorAll('.report,.empty,.foot').forEach(el => el.remove());
    aurora.className = 'aurora';

    await sleep(260);
    const res = await fetchReport(phone);

    btn.classList.remove('busy');
    if (!res.ok) renderEmpty('No Records Found', res.error);
    else renderReport(res.data);

    input.disabled = false;
    btn.disabled = false;
    busy = false;
    input.focus();
  }

  form.addEventListener('submit', e => { e.preventDefault(); run(); });
})();
</script>
</body>
</html>
