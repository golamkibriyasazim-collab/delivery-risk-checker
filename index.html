<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Corrix — Dispatch Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#06070C;
    --surface:rgba(255,255,255,0.02);
    --surface-2:rgba(255,255,255,0.04);
    --hairline:rgba(255,255,255,0.075);
    --hairline-strong:rgba(255,255,255,0.16);
    --text:#EDEEF5;
    --muted:#7B7F9E;
    --dim:#3E4159;
    --danger:#FF4D6D;
    --warn:#F5B944;
    --safe:#2EE6A4;
    --blue:#5B8DEF;
    --mono:'JetBrains Mono',ui-monospace,monospace;
  }
  html,body{
    min-height:100vh;background:var(--bg);color:var(--text);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;
  }
  .bn{font-family:'Hind Siliguri','Inter',sans-serif}
  .mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
  ::selection{background:rgba(255,77,109,0.35);color:#fff}
  button,input{font-family:inherit;border:none;outline:none;background:none;color:inherit}
  button{cursor:pointer}

  /* ========== BACKDROP ========== */
  .backdrop{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  .backdrop::before{
    content:'';position:absolute;inset:0;
    background:radial-gradient(70% 45% at 50% 0%,rgba(255,77,109,0.13) 0%,transparent 60%),
               radial-gradient(50% 40% at 85% 100%,rgba(91,141,239,0.09) 0%,transparent 60%);
  }
  .grid{
    position:absolute;inset:-1px;
    background-image:
      linear-gradient(rgba(255,255,255,0.018) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,0.018) 1px,transparent 1px);
    background-size:52px 52px;
    -webkit-mask-image:radial-gradient(ellipse 90% 60% at 50% 30%,#000 20%,transparent 80%);
    mask-image:radial-gradient(ellipse 90% 60% at 50% 30%,#000 20%,transparent 80%);
  }
  .scan{
    position:absolute;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,77,109,0.4),transparent);
    animation:sweepDown 14s linear infinite;
  }
  @keyframes sweepDown{from{top:-2%}to{top:102%}}

  /* ========== SHELL ========== */
  .shell{
    position:relative;z-index:2;
    max-width:460px;margin:0 auto;
    padding:22px 20px 70px;
  }

  /* ========== TOPBAR ========== */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding-bottom:18px;margin-bottom:44px;
    border-bottom:1px solid var(--hairline);
    position:relative;
  }
  .topbar::after{
    content:'';position:absolute;bottom:-1px;left:0;width:0;height:1px;
    background:linear-gradient(90deg,var(--danger),transparent);
    animation:drawLine 1.4s 0.2s cubic-bezier(0.16,1,0.3,1) forwards;
  }
  @keyframes drawLine{to{width:100%}}

  .logo{
    display:flex;align-items:center;gap:9px;
    font-family:var(--mono);font-size:12px;font-weight:700;
    letter-spacing:0.22em;color:var(--text);
  }
  .logo-mark{
    width:22px;height:22px;
    display:flex;align-items:center;justify-content:center;
    color:var(--danger);
    font-size:14px;line-height:1;
    animation:spinSlow 8s linear infinite;
  }
  @keyframes spinSlow{to{transform:rotate(360deg)}}

  .live{
    display:flex;align-items:center;gap:7px;
    font-family:var(--mono);font-size:10px;font-weight:600;
    letter-spacing:0.18em;color:var(--safe);
  }
  .live .d{
    width:5px;height:5px;border-radius:50%;background:var(--safe);
    box-shadow:0 0 8px var(--safe);
    animation:blink 2s ease-in-out infinite;
  }
  @keyframes blink{50%{opacity:0.3}}

  /* ========== HERO ========== */
  .hero{margin-bottom:34px}
  .eyebrow{
    display:flex;align-items:center;gap:10px;
    font-family:var(--mono);font-size:10.5px;font-weight:600;
    letter-spacing:0.24em;color:var(--dim);
    text-transform:uppercase;margin-bottom:22px;
    opacity:0;animation:upIn 0.7s 0.35s cubic-bezier(0.16,1,0.3,1) forwards;
  }
  .eyebrow .ln{
    width:22px;height:1px;background:var(--dim);
    display:inline-block;
  }
  @keyframes upIn{to{opacity:1;transform:none}from{transform:translateY(10px)}}

  .headline{
    font-size:40px;font-weight:800;
    letter-spacing:-0.045em;line-height:1.02;
    color:var(--text);
    opacity:0;animation:upIn 0.9s 0.45s cubic-bezier(0.16,1,0.3,1) forwards;
  }
  .headline em{
    font-style:normal;font-weight:300;
    color:var(--muted);
    display:block;
    position:relative;
  }
  .headline em::after{
    content:'_';color:var(--danger);
    animation:cursorBlink 1.1s steps(2) infinite;
    font-weight:400;
    margin-left:2px;
  }
  @keyframes cursorBlink{50%{opacity:0}}

  /* ========== SEARCH ========== */
  .search-zone{
    margin-bottom:36px;
    opacity:0;animation:upIn 0.9s 0.6s cubic-bezier(0.16,1,0.3,1) forwards;
  }
  .search{
    position:relative;
    display:flex;align-items:center;
    padding:4px 4px 4px 20px;
    border:1px solid var(--hairline);
    background:rgba(10,11,20,0.6);
    backdrop-filter:blur(20px);
    transition:border-color 0.4s ease,box-shadow 0.4s ease,background 0.4s ease;
    border-radius:2px;
  }
  .search.focus{
    border-color:transparent;
    background:rgba(12,13,24,0.85);
    box-shadow:0 0 0 1px rgba(255,77,109,0.3),0 20px 50px -20px rgba(255,77,109,0.35);
  }
  .search.err{
    border-color:rgba(255,77,109,0.6);
    animation:shake 0.42s cubic-bezier(.36,.07,.19,.97);
  }
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-5px)}
    50%{transform:translateX(5px)}
    75%{transform:translateX(-3px)}
  }

  /* Corner brackets */
  .brk{
    position:absolute;width:10px;height:10px;
    border:1.5px solid transparent;
    transition:all 0.4s cubic-bezier(0.16,1,0.3,1);
    pointer-events:none;
  }
  .brk.tl{top:-1px;left:-1px;border-right:none;border-bottom:none;border-top-color:var(--hairline);border-left-color:var(--hairline)}
  .brk.tr{top:-1px;right:-1px;border-left:none;border-bottom:none;border-top-color:var(--hairline);border-right-color:var(--hairline)}
  .brk.bl{bottom:-1px;left:-1px;border-right:none;border-top:none;border-bottom-color:var(--hairline);border-left-color:var(--hairline)}
  .brk.br{bottom:-1px;right:-1px;border-left:none;border-top:none;border-bottom-color:var(--hairline);border-right-color:var(--hairline)}
  .search.focus .brk{width:16px;height:16px;border-color:var(--danger)!important}

  .prefix{
    font-family:var(--mono);font-size:14px;font-weight:600;
    color:var(--dim);letter-spacing:0.05em;
    padding-right:8px;
    border-right:1px solid var(--hairline);
    margin-right:12px;
    transition:color 0.3s ease;
  }
  .search.focus .prefix{color:var(--muted)}

  .search input{
    flex:1;
    font-family:var(--mono);font-size:16px;font-weight:600;
    letter-spacing:0.08em;
    padding:16px 0;
    color:#fff;
    font-variant-numeric:tabular-nums;
    min-width:0;
  }
  .search input::placeholder{
    color:var(--dim);
    font-weight:500;
    letter-spacing:0.02em;
  }

  .submit{
    display:flex;align-items:center;gap:8px;
    padding:14px 18px;
    background:var(--danger);
    color:#fff;
    font-family:var(--mono);font-size:12px;font-weight:700;
    letter-spacing:0.14em;
    border-radius:2px;
    position:relative;overflow:hidden;
    transition:all 0.3s cubic-bezier(0.16,1,0.3,1);
  }
  .submit::before{
    content:'';position:absolute;inset:0;
    background:linear-gradient(120deg,transparent 40%,rgba(255,255,255,0.35) 50%,transparent 60%);
    transform:translateX(-100%);
    transition:transform 0.6s ease;
  }
  .submit:hover:not(:disabled)::before{transform:translateX(100%)}
  .submit:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 10px 25px -8px rgba(255,77,109,0.7)}
  .submit:active:not(:disabled){transform:translateY(0)}
  .submit:disabled{cursor:not-allowed}
  .submit svg{transition:transform 0.3s ease}
  .submit:hover:not(:disabled) svg{transform:translateX(3px)}
  .submit.busy{
    background:rgba(255,77,109,0.15);
    color:var(--danger);
    box-shadow:inset 0 0 0 1px rgba(255,77,109,0.35);
  }
  .submit.busy .txt,.submit.busy svg{display:none}
  .submit .sp{
    display:none;
    width:14px;height:14px;border-radius:50%;
    border:2px solid rgba(255,77,109,0.25);
    border-top-color:var(--danger);
    animation:spin 0.75s linear infinite;
  }
  .submit.busy .sp{display:block}
  @keyframes spin{to{transform:rotate(360deg)}}

  .hint{
    font-family:var(--mono);font-size:11px;
    color:var(--danger);letter-spacing:0.05em;
    margin-top:10px;padding-left:4px;
    min-height:14px;
    opacity:0;transform:translateY(-4px);
    transition:all 0.3s ease;
  }
  .hint.on{opacity:1;transform:none}

  /* ========== STAGE ========== */
  .stage{position:relative;min-height:200px}

  /* ---- Idle state ---- */
  .idle{
    display:flex;flex-direction:column;align-items:center;
    padding:70px 20px;
    opacity:0;animation:upIn 0.9s 0.75s cubic-bezier(0.16,1,0.3,1) forwards;
  }
  .idle.hide{display:none}
  .tick-ring{
    position:relative;
    width:78px;height:78px;
    margin-bottom:22px;
    display:flex;align-items:center;justify-content:center;
  }
  .tick-ring::before{
    content:'';position:absolute;inset:0;border-radius:50%;
    border:1px dashed rgba(255,255,255,0.1);
    animation:spinSlow 24s linear infinite;
  }
  .tick-ring::after{
    content:'';position:absolute;inset:0;border-radius:50%;
    border:1px solid transparent;
    border-top-color:var(--danger);
    border-right-color:rgba(255,77,109,0.3);
    animation:spinSlow 4s linear infinite reverse;
  }
  .tick-core{
    width:8px;height:8px;border-radius:50%;
    background:var(--danger);
    box-shadow:0 0 20px rgba(255,77,109,0.8);
    animation:coreBreathe 2.4s ease-in-out infinite;
  }
  @keyframes coreBreathe{
    0%,100%{transform:scale(1);opacity:1}
    50%{transform:scale(0.55);opacity:0.6}
  }
  .idle-txt{
    font-family:var(--mono);font-size:11px;
    color:var(--dim);letter-spacing:0.2em;
    text-transform:uppercase;
    text-align:center;line-height:1.9;
  }
  .idle-txt .sub{
    display:block;color:var(--muted);
    font-size:10.5px;
    margin-top:2px;
    letter-spacing:0.18em;
  }

  /* ========== REPORT ========== */
  .report{display:none;flex-direction:column;gap:0}
  .report.on{display:flex}

  /* --- Terminal header --- */
  .term-head{
    display:flex;align-items:center;justify-content:space-between;
    font-family:var(--mono);font-size:10px;letter-spacing:0.22em;
    text-transform:uppercase;color:var(--dim);
    padding:0 2px 12px;
    border-bottom:1px solid var(--hairline);
    opacity:0;
  }
  .report.on .term-head{animation:upIn 0.6s 0.1s ease forwards}
  .term-head .left{display:flex;align-items:center;gap:8px}
  .term-head .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--safe);
    box-shadow:0 0 8px var(--safe);
    animation:blink 1.6s ease-in-out infinite;
  }

  /* --- Identity block --- */
  .identity{
    padding:28px 0 22px;
    border-bottom:1px solid var(--hairline);
    position:relative;
    opacity:0;
  }
  .report.on .identity{animation:upIn 0.7s 0.2s cubic-bezier(0.16,1,0.3,1) forwards}

  .id-label{
    display:flex;align-items:center;justify-content:space-between;
    font-family:var(--mono);font-size:10px;letter-spacing:0.24em;
    text-transform:uppercase;color:var(--dim);
    margin-bottom:14px;
  }

  /* Odometer phone */
  .odometer{
    display:flex;align-items:center;
    font-family:var(--mono);
    font-size:34px;font-weight:700;
    letter-spacing:-0.02em;
    color:#fff;
    height:38px;
    line-height:38px;
    gap:0;
    overflow:hidden;
  }
  .d-slot{
    display:inline-block;
    height:38px;
    overflow:hidden;
    vertical-align:top;
    width:0.62em;
    text-align:center;
  }
  .d-slot.ch{width:auto;padding:0 2px;color:var(--dim)}
  .d-reel{
    display:block;
    transition:transform 1.3s cubic-bezier(0.16,1,0.3,1);
    will-change:transform;
  }
  .d-reel>span{
    display:block;height:38px;line-height:38px;
  }

  /* Risk stamp */
  .stamp-wrap{
    position:absolute;
    right:-4px;top:24px;
    transform-origin:right center;
    pointer-events:none;
  }
  .stamp{
    position:relative;
    font-family:var(--mono);font-size:12px;font-weight:800;
    letter-spacing:0.28em;text-transform:uppercase;
    padding:8px 14px;
    border:2px solid currentColor;
    border-radius:2px;
    transform:rotate(-7deg) scale(2);
    opacity:0;
    white-space:nowrap;
    display:inline-block;
  }
  .stamp.ink{color:var(--danger)}
  .stamp.caution{color:var(--warn)}
  .stamp.safe{color:var(--safe)}
  .stamp::before{
    content:'';position:absolute;inset:-3px;
    border:1px solid currentColor;opacity:0.35;
    border-radius:2px;
  }
  .report.on .stamp{animation:slam 0.65s 0.75s cubic-bezier(0.34,1.56,0.64,1) forwards}
  @keyframes slam{
    0%{opacity:0;transform:rotate(-7deg) scale(2.2);filter:blur(6px)}
    65%{opacity:1;filter:blur(0)}
    80%{transform:rotate(-7deg) scale(0.96)}
    100%{opacity:1;transform:rotate(-7deg) scale(1)}
  }

  /* Meta row */
  .meta-line{
    display:flex;align-items:center;gap:10px;
    margin-top:14px;
    font-family:var(--mono);font-size:10px;
    letter-spacing:0.14em;color:var(--dim);
    text-transform:uppercase;
  }
  .meta-line .sep{
    flex:1;height:1px;
    background:linear-gradient(90deg,var(--hairline),transparent);
  }

  /* --- Score block --- */
  .score-block{
    padding:32px 0 26px;
    border-bottom:1px solid var(--hairline);
    display:grid;
    grid-template-columns:1fr auto;
    gap:24px;
    align-items:center;
    opacity:0;
  }
  .report.on .score-block{animation:upIn 0.8s 0.4s cubic-bezier(0.16,1,0.3,1) forwards}

  .score-label{
    font-family:var(--mono);font-size:10px;letter-spacing:0.24em;
    text-transform:uppercase;color:var(--dim);
    margin-bottom:14px;
  }
  .score-num{
    font-family:var(--mono);
    font-size:72px;font-weight:800;
    line-height:0.9;
    letter-spacing:-0.06em;
    color:#fff;
    display:flex;align-items:baseline;
    font-variant-numeric:tabular-nums;
  }
  .score-num .sf{
    font-size:28px;color:var(--muted);
    margin-left:2px;font-weight:600;
    letter-spacing:0;
  }
  .score-cap{
    font-family:var(--mono);font-size:10.5px;
    color:var(--muted);letter-spacing:0.06em;
    margin-top:12px;
    padding-left:2px;
  }
  .score-cap b{color:var(--text);font-weight:700}

  /* Radial gauge */
  .radial{
    position:relative;
    width:138px;height:138px;
    flex-shrink:0;
  }
  .radial svg{
    width:100%;height:100%;
    transform:rotate(-90deg);
    overflow:visible;
  }
  .r-track{fill:none;stroke:rgba(255,255,255,0.055);stroke-width:6}
  .r-prog{
    fill:none;stroke-width:6;stroke-linecap:round;
    stroke-dasharray:314.16;
    stroke-dashoffset:314.16;
    transition:stroke-dashoffset 2s cubic-bezier(0.16,1,0.3,1);
    filter:drop-shadow(0 0 6px currentColor);
  }
  .r-tick{
    fill:none;stroke:rgba(255,255,255,0.06);stroke-width:1;
  }
  .r-pen{
    fill:currentColor;
    filter:drop-shadow(0 0 8px currentColor);
    transition:transform 2s cubic-bezier(0.16,1,0.3,1);
    transform-origin:center;
    transform-box:fill-box;
  }
  .r-ring{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    text-align:center;
  }
  .r-ring-num{
    font-family:var(--mono);font-size:22px;
    font-weight:700;letter-spacing:-0.03em;
    color:var(--text);line-height:1;
  }
  .r-ring-txt{
    font-family:var(--mono);font-size:8.5px;
    letter-spacing:0.22em;text-transform:uppercase;
    color:var(--dim);margin-top:5px;
  }

  /* --- Bengali message --- */
  .bengali-msg{
    padding:22px 0 24px;
    border-bottom:1px solid var(--hairline);
    font-size:15px;line-height:1.75;
    color:#C9CBDA;
    opacity:0;
    position:relative;
    padding-left:20px;
  }
  .report.on .bengali-msg{animation:upIn 0.7s 1.1s cubic-bezier(0.16,1,0.3,1) forwards}
  .bengali-msg::before{
    content:'';position:absolute;
    left:0;top:26px;bottom:26px;
    width:2px;
    background:linear-gradient(180deg,var(--danger),transparent);
    transform:scaleY(0);transform-origin:top;
  }
  .report.on .bengali-msg::before{
    animation:barGrow 0.9s 1.5s cubic-bezier(0.16,1,0.3,1) forwards;
  }
  @keyframes barGrow{to{transform:scaleY(1)}}

  /* --- Stats --- */
  .stats{
    display:grid;grid-template-columns:repeat(3,1fr);
    padding:26px 0 24px;
    border-bottom:1px solid var(--hairline);
  }
  .stat{
    padding-right:12px;
    position:relative;
  }
  .stat+.stat{padding-left:18px}
  .stat+.stat::before{
    content:'';position:absolute;
    left:0;top:8%;bottom:8%;width:1px;
    background:var(--hairline);
    transform:scaleY(0);transform-origin:top;
  }
  .report.on .stat+.stat::before{
    animation:barGrow 0.7s cubic-bezier(0.16,1,0.3,1) forwards;
  }
  .report.on .stat:nth-child(2)::before{animation-delay:1.75s}
  .report.on .stat:nth-child(3)::before{animation-delay:1.85s}

  .stat-num{
    font-family:var(--mono);font-size:32px;font-weight:800;
    letter-spacing:-0.045em;line-height:1;
    font-variant-numeric:tabular-nums;
    margin-bottom:10px;
  }
  .stat-lbl{
    font-family:var(--mono);font-size:9px;
    letter-spacing:0.22em;text-transform:uppercase;
    color:var(--dim);
    opacity:0.9;
  }
  .stat-bar{
    position:relative;
    margin-top:12px;
    height:1px;
    background:rgba(255,255,255,0.06);
    overflow:hidden;
  }
  .stat-bar::after{
    content:'';position:absolute;left:0;top:0;bottom:0;
    width:0;background:currentColor;
    box-shadow:0 0 8px currentColor;
  }
  .report.on .stat-bar::after{
    animation:barFill 1.2s cubic-bezier(0.16,1,0.3,1) forwards;
  }
  @keyframes barFill{to{width:100%}}

  /* --- Couriers --- */
  .couriers-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:24px 0 14px;
    opacity:0;
  }
  .report.on .couriers-head{animation:upIn 0.6s 1.9s ease forwards}
  .couriers-head h3{
    font-size:14px;font-weight:700;
    letter-spacing:-0.01em;
    display:flex;align-items:center;gap:8px;
  }
  .couriers-head h3::before{
    content:'';width:3px;height:12px;
    background:var(--danger);
    border-radius:1px;
  }
  .couriers-head .cnt{
    font-family:var(--mono);font-size:10px;
    letter-spacing:0.2em;text-transform:uppercase;
    color:var(--dim);
  }

  .courier-list{
    display:flex;flex-direction:column;
    gap:0;
  }
  .courier-row{
    display:grid;
    grid-template-columns:1.4fr 0.6fr 1.2fr auto;
    align-items:center;
    gap:14px;
    padding:18px 0;
    border-bottom:1px solid var(--hairline);
    position:relative;
    opacity:0;
    transform:translateX(24px);
  }
  .courier-row:last-child{border-bottom:none}
  .report.on .courier-row{
    animation:tapeIn 0.7s cubic-bezier(0.16,1,0.3,1) forwards;
  }
  @keyframes tapeIn{to{opacity:1;transform:translateX(0)}}

  .c-name{
    display:flex;align-items:center;gap:10px;
    font-size:14.5px;font-weight:600;color:#fff;
    min-width:0;
  }
  .c-dot{
    width:8px;height:8px;border-radius:2px;
    flex-shrink:0;position:relative;
    box-shadow:0 0 8px currentColor;
  }
  .report.on .c-dot::after{
    content:'';position:absolute;inset:-4px;
    border:1px solid currentColor;border-radius:3px;
    opacity:0.35;
    animation:dotPulse 2.6s ease-in-out infinite;
  }
  @keyframes dotPulse{50%{transform:scale(1.35);opacity:0}}

  .c-orders{
    font-family:var(--mono);font-size:14px;
    font-weight:600;color:var(--muted);
    text-align:center;
    font-variant-numeric:tabular-nums;
  }
  .c-orders .lbl{
    font-size:8.5px;display:block;
    letter-spacing:0.2em;color:var(--dim);
    margin-top:3px;font-weight:500;
  }

  .c-bar{
    height:3px;border-radius:3px;
    background:rgba(255,255,255,0.05);
    overflow:hidden;position:relative;
  }
  .c-bar::after{
    content:'';position:absolute;left:0;top:0;bottom:0;
    width:0%;
    border-radius:3px;
    transition:width 1.6s cubic-bezier(0.16,1,0.3,1);
    box-shadow:0 0 8px currentColor;
  }

  .c-rate{
    font-family:var(--mono);font-size:14px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
    text-align:right;
    min-width:52px;
  }

  /* --- Footer note --- */
  .foot{
    margin-top:34px;
    padding-top:16px;
    border-top:1px solid var(--hairline);
    font-family:var(--mono);font-size:10px;
    letter-spacing:0.18em;text-transform:uppercase;
    color:var(--dim);
    display:flex;align-items:center;justify-content:space-between;
    opacity:0;transition:opacity 0.6s ease;
  }
  .foot.on{opacity:1}
  .foot .sep{
    flex:1;height:1px;margin:0 12px;
    background:linear-gradient(90deg,transparent,var(--hairline),transparent);
  }

  /* --- Empty --- */
  .empty{
    padding:56px 24px;
    text-align:center;
    border-top:1px solid var(--hairline);
    border-bottom:1px solid var(--hairline);
    opacity:0;transform:translateY(16px);
    transition:all 0.7s cubic-bezier(0.16,1,0.3,1);
  }
  .empty.on{opacity:1;transform:none}
  .empty-ico{
    width:36px;height:36px;margin:0 auto 18px;
    color:var(--danger);
  }
  .empty-ttl{
    font-family:var(--mono);font-size:13px;
    letter-spacing:0.24em;text-transform:uppercase;
    color:var(--danger);margin-bottom:14px;
  }
  .empty-dsc{
    font-size:13.5px;color:var(--muted);
    line-height:1.7;max-width:320px;margin:0 auto;
  }

  @media (max-width:400px){
    .shell{padding:20px 16px 60px}
    .headline{font-size:34px}
    .odometer{font-size:28px;height:32px;line-height:32px}
    .d-slot{height:32px}
    .d-reel>span{height:32px;line-height:32px}
    .score-num{font-size:58px}
    .score-num .sf{font-size:22px}
    .radial{width:112px;height:112px}
    .stat-num{font-size:26px}
    .stamp{font-size:10px;padding:6px 10px;letter-spacing:0.22em}
    .stamp-wrap{top:20px}
  }
</style>
</head>
<body>

<div class="backdrop">
  <div class="grid"></div>
  <div class="scan"></div>
</div>

<div class="shell">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="logo">
      <span class="logo-mark">◆</span>
      CORRIX
    </div>
    <div class="live"><span class="d"></span>SECURE / LIVE</div>
  </div>

  <!-- HERO -->
  <section class="hero">
    <div class="eyebrow">
      <span class="ln"></span>
      FRAUD INTELLIGENCE UNIT
    </div>
    <h1 class="headline">
      Verify before
      <em>you ship.</em>
    </h1>
  </section>

  <!-- SEARCH -->
  <section class="search-zone">
    <form class="search" id="form">
      <span class="brk tl"></span>
      <span class="brk tr"></span>
      <span class="brk bl"></span>
      <span class="brk br"></span>
      <span class="prefix">+88</span>
      <input id="phone" type="tel" placeholder="01XXXXXXXXX" autocomplete="off" inputmode="numeric" maxlength="15"
             oninput="this.value=this.value.replace(/[^0-9]/g,'')">
      <button type="submit" class="submit" id="btn">
        <span class="txt">SCAN</span>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
        </svg>
        <span class="sp"></span>
      </button>
    </form>
    <div class="hint mono" id="hint"></div>
  </section>

  <!-- STAGE -->
  <section class="stage" id="stage">
    <div class="idle" id="idle">
      <div class="tick-ring">
        <div class="tick-core"></div>
      </div>
      <div class="idle-txt mono">
        Awaiting target
        <span class="sub bn">ডেলিভারি হিস্ট্রি দেখতে নম্বর দিন</span>
      </div>
    </div>
  </section>

</div>

<script>
(() => {
  'use strict';
  // 🔒 API URL is hidden behind serverless proxy — no real endpoint in browser
  const API = '/api/check?phone=';
  const $ = (s,c=document)=>c.querySelector(s);
  const $$ = (s,c=document)=>Array.from(c.querySelectorAll(s));
  const sleep = ms => new Promise(r=>setTimeout(r,ms));

  const input = $('#phone');
  const form = $('#form');
  const btn = $('#btn');
  const hint = $('#hint');
  const idle = $('#idle');
  const stage = $('#stage');

  let busy = false;

  // ---------- Focus effects ----------
  input.addEventListener('focus', () => form.classList.add('focus'));
  input.addEventListener('blur', () => form.classList.remove('focus'));
  input.addEventListener('input', () => {
    if (form.classList.contains('err')) {
      form.classList.remove('err');
      hint.classList.remove('on');
    }
  });

  function showErr(msg){
    form.classList.remove('err');
    void form.offsetWidth;
    form.classList.add('err');
    hint.textContent = msg;
    hint.classList.add('on');
  }

  // ---------- Risk style ----------
  function riskOf(level, rate){
    const l = (level||'').toLowerCase();
    if (l === 'high' || rate < 50) return { cls:'ink', color:'#FF4D6D', txt:'HIGH RISK' };
    if (l === 'moderate' || l === 'medium' || rate < 80) return { cls:'caution', color:'#F5B944', txt:'CAUTION' };
    return { cls:'safe', color:'#2EE6A4', txt:'SAFE' };
  }
  function rateColor(r){
    if (r >= 75) return '#2EE6A4';
    if (r >= 50) return '#F5B944';
    return '#FF4D6D';
  }

  // ---------- Odometer ----------
  function odometerHTML(phone){
    let formatted = phone;
    if (phone.length === 11) formatted = phone.slice(0,5) + '-' + phone.slice(5);
    return [...formatted].map(ch => {
      if (!/\d/.test(ch)) return `<span class="d-slot ch">${ch}</span>`;
      const t = parseInt(ch);
      let reel = '';
      for (let i = 0; i <= 9; i++) reel += `<span>${i}</span>`;
      return `<span class="d-slot" data-target="${t}"><span class="d-reel">${reel}</span></span>`;
    }).join('');
  }

  function runOdometer(){
    const slots = $$('.d-slot[data-target]');
    slots.forEach((slot, i) => {
      const target = parseInt(slot.dataset.target);
      const reel = slot.querySelector('.d-reel');
      setTimeout(() => {
        reel.style.transform = `translateY(-${target * slot.offsetHeight}px)`;
      }, i * 70);
    });
  }

  // ---------- Count up ----------
  function countUp(el, target, dur=1400, suffix=''){
    const t = Number(target) || 0;
    const start = performance.now();
    function tick(now){
      const p = Math.min((now - start) / dur, 1);
      const eased = 1 - Math.pow(1 - p, 4);
      el.textContent = Math.round(eased * t) + suffix;
      if (p < 1) requestAnimationFrame(tick);
      else el.textContent = t + suffix;
    }
    requestAnimationFrame(tick);
  }

  // ---------- Text decode ----------
  const BN = 'অআইঈউঊঋএঐওঔকখগঘঙচছজঝঞটঠডঢণতথদধনপফবভমযরলশষসহািীুূৃেৈোৌ';
  function decodeText(el, finalText, dur=1600){
    const chars = [...finalText];
    const total = chars.length;
    const start = performance.now();
    function frame(now){
      const p = Math.min((now - start) / dur, 1);
      const reveal = Math.floor(p * total);
      let out = '';
      for (let i = 0; i < total; i++){
        if (i < reveal) out += chars[i];
        else if (chars[i] === ' ' || chars[i] === '\n') out += chars[i];
        else out += BN[Math.floor(Math.random() * BN.length)];
      }
      el.textContent = out;
      if (p < 1) requestAnimationFrame(frame);
      else el.textContent = finalText;
    }
    requestAnimationFrame(frame);
  }

  // ---------- API (calls hidden proxy) ----------
  async function fetchReport(phone){
    try{
      const res = await fetch(API + encodeURIComponent(phone), { method:'GET' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const j = await res.json();
      if (j && j.success && j.data) return { ok:true, data:j.data };
      return { ok:false, error:'এই নম্বরে কোনো ডেলিভারি রেকর্ড নেই।' };
    }catch(e){
      console.error(e);
      return { ok:false, error:'সার্ভারে সংযোগ ব্যর্থ। ইন্টারনেট বা CORS সমস্যা।' };
    }
  }

  // ---------- Render empty ----------
  function renderEmpty(title, desc){
    stage.innerHTML = `
      <div class="empty" id="emp">
        <svg class="empty-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <circle cx="12" cy="16" r="0.5" fill="currentColor"/>
        </svg>
        <div class="empty-ttl">${title}</div>
        <p class="empty-dsc bn">${desc}</p>
      </div>`;
    requestAnimationFrame(() => $('#emp')?.classList.add('on'));
  }

  // ---------- Render report ----------
  function renderReport(d){
    const rate = Number(d.deliveryRate) || 0;
    const rs = riskOf(d.riskLevel, rate);
    const CIRC = 314.16;
    const offset = CIRC - (CIRC * Math.min(Math.max(rate,0),100) / 100);
    const rotation = (Math.min(Math.max(rate,0),100) / 100) * 360;

    const dt = d.searchDate ? new Date(d.searchDate) : new Date();
    const timeStr = dt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
    const dateStr = dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}).toUpperCase();
    const scanId = '#' + String(Math.floor(Math.random()*9000+1000));

    const active = (d.couriers || []).filter(c => Number(c.orders) > 0);

    stage.innerHTML = `
      <article class="report" id="rep">
        <div class="term-head">
          <div class="left"><span class="dot"></span>SCAN ${scanId}</div>
          <div>${dateStr} · ${timeStr}</div>
        </div>

        <div class="identity">
          <div class="id-label">
            <span>Target Entity</span>
            <span>${(d.phoneNumber||'').length} digits</span>
          </div>
          <div class="odometer" id="odo">${odometerHTML(d.phoneNumber || '')}</div>
          <div class="stamp-wrap">
            <div class="stamp ${rs.cls}">${rs.txt}</div>
          </div>
          <div class="meta-line">
            <span>CROSS-NETWORK</span>
            <span class="sep"></span>
            <span>${(d.couriers||[]).length} PARTNERS</span>
          </div>
        </div>

        <div class="score-block">
          <div>
            <div class="score-label">Success Rate</div>
            <div class="score-num">
              <span id="scVal">0</span><span class="sf">%</span>
            </div>
            <div class="score-cap">
              <b id="scD">0</b> delivered · <b id="scC">0</b> returned
            </div>
          </div>
          <div class="radial">
            <svg viewBox="0 0 120 120">
              <circle class="r-tick" cx="60" cy="60" r="50" stroke-dasharray="1 6"/>
              <circle class="r-track" cx="60" cy="60" r="50"/>
              <circle class="r-prog" id="prog" cx="60" cy="60" r="50"
                      stroke="${rs.color}"
                      stroke-dasharray="${CIRC}"
                      stroke-dashoffset="${CIRC}"/>
              <circle class="r-pen" id="pen" cx="60" cy="10" r="3"
                      style="color:${rs.color};transform:rotate(0deg);transform-origin:60px 60px"/>
            </svg>
            <div class="r-ring">
              <div class="r-ring-num mono" id="ringVal">0%</div>
              <div class="r-ring-txt">DELIVERY</div>
            </div>
          </div>
        </div>

        ${d.riskMessage ? `<div class="bengali-msg bn" id="bnMsg"></div>` : ''}

        <div class="stats">
          <div class="stat" style="color:#5B8DEF">
            <div class="stat-num num" id="sOrders">0</div>
            <div class="stat-lbl">Orders</div>
            <div class="stat-bar"></div>
          </div>
          <div class="stat" style="color:#2EE6A4">
            <div class="stat-num num" id="sDeliv">0</div>
            <div class="stat-lbl">Success</div>
            <div class="stat-bar"></div>
          </div>
          <div class="stat" style="color:#FF4D6D">
            <div class="stat-num num" id="sCancel">0</div>
            <div class="stat-lbl">Returns</div>
            <div class="stat-bar"></div>
          </div>
        </div>

        <div class="couriers-head">
          <h3>Network Breakdown</h3>
          <span class="cnt">${active.length} ACTIVE</span>
        </div>

        <div class="courier-list">
          ${
            active.length ? active.map((c, i) => {
              const raw = parseFloat(String(c.delivery_rate).replace(/[^0-9.]/g,'')) || 0;
              const col = rateColor(raw);
              const shown = Number.isInteger(raw) ? raw : raw.toFixed(1);
              const w = Math.min(raw, 100);
              return `
                <div class="courier-row" data-i="${i}">
                  <div class="c-name">
                    <span class="c-dot" style="background:${col};color:${col}"></span>
                    <span>${c.name}</span>
                  </div>
                  <div class="c-orders num">
                    ${c.orders||0}
                    <span class="lbl mono">ORD</span>
                  </div>
                  <div class="c-bar" data-w="${w}" style="color:${col}"></div>
                  <div class="c-rate num" style="color:${col}" data-t="${shown}">0%</div>
                </div>`;
            }).join('') : `<div class="courier-row" style="grid-template-columns:1fr;justify-content:center;color:var(--muted);font-size:13px">No courier history</div>`
          }
        </div>

        <div class="foot" id="foot">
          <span>${(d.couriers||[]).length} NETWORKS</span>
          <span class="sep"></span>
          <span>END OF REPORT</span>
        </div>
      </article>
    `;

    const rep = $('#rep');

    setTimeout(() => {
      rep.classList.add('on');
      requestAnimationFrame(() => runOdometer());
    }, 20);

    setTimeout(() => {
      $('#prog').style.strokeDashoffset = offset.toFixed(2);
      $('#pen').style.transform = `rotate(${rotation}deg)`;
    }, 900);

    setTimeout(() => countUp($('#scVal'), Math.round(rate), 1700), 900);
    setTimeout(() => {
      const dEl = $('#scD'), cEl = $('#scC');
      if (dEl) countUp(dEl, d.totalDelivered, 1200);
      if (cEl) countUp(cEl, d.totalCancelled, 1200);
    }, 1100);

    setTimeout(() => countUp($('#ringVal'), Math.round(rate), 1700, '%'), 900);

    setTimeout(() => {
      countUp($('#sOrders'), d.totalOrders, 1200);
      countUp($('#sDeliv'), d.totalDelivered, 1200);
      countUp($('#sCancel'), d.totalCancelled, 1200);
    }, 1700);

    if (d.riskMessage){
      setTimeout(() => {
        const el = $('#bnMsg');
        if (el) decodeText(el, d.riskMessage, 1800);
      }, 1100);
    }

    setTimeout(() => {
      $$('.courier-row').forEach((row, i) => {
        row.style.animationDelay = (i * 0.11) + 's';
      });
    }, 1900);

    setTimeout(() => {
      $$('.courier-row').forEach((row, i) => {
        const bar = row.querySelector('.c-bar');
        if (bar){
          const style = document.createElement('style');
          style.textContent = `.courier-row[data-i="${i}"] .c-bar::after{width:${bar.dataset.w}%}`;
          document.head.appendChild(style);
        }
        const rateEl = row.querySelector('.c-rate[data-t]');
        if (rateEl){
          const t = parseFloat(rateEl.dataset.t) || 0;
          setTimeout(() => countUp(rateEl, t, 1200, '%'), i*90);
        }
      });
    }, 2000);

    setTimeout(() => $('#foot')?.classList.add('on'), 2800);
  }

  // ---------- Flow ----------
  async function run(){
    if (busy) return;
    const phone = input.value.trim().replace(/\D/g,'');
    if (phone.length < 10){ showErr('সঠিক ১১ ডিজিটের মোবাইল নম্বর দিন।'); return; }

    busy = true;
    hint.classList.remove('on');
    input.disabled = true;
    btn.disabled = true;
    btn.classList.add('busy');

    idle.classList.add('hide');
    stage.innerHTML = '';

    await sleep(220);
    const res = await fetchReport(phone);

    btn.classList.remove('busy');
    if (!res.ok) renderEmpty('NO DATA', res.error);
    else renderReport(res.data);

    input.disabled = false;
    btn.disabled = false;
    busy = false;
    input.focus();
  }

  form.addEventListener('submit', e => { e.preventDefault(); run(); });
})();
</script>
</body>
</html>
